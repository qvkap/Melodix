name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: Melodix-Linux
          - os: windows-latest
            platform: windows
            artifact_name: Melodix-Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare yt-dlp binaries
        shell: bash
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp

      - name: Build Electron Main & Renderer
        run: |
          npm run build:electron
          npx vite build

      - name: Package Linux (AppImage & deb)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows (Portable & zip)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

      # Upload assets to release — allowUpdates:true handles existing releases gracefully
      - name: Upload release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.AppImage,dist/*.deb,dist/latest*.yml"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.exe,dist/*.zip,dist/*.blockmap,dist/latest*.yml"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
