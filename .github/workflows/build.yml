name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: Melodix-Linux

          - os: windows-latest
            platform: windows
            artifact_name: Melodix-Windows

          - os: macos-latest
            platform: mac
            artifact_name: Melodix-macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare yt-dlp binaries
        shell: bash
        run: |
          mkdir -p bin
          # Windows binary
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
          # Linux / macOS binary
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp
          # macOS binary (universal)
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/yt-dlp_macos
          chmod +x bin/yt-dlp_macos

      - name: Build Electron Main & Renderer
        run: |
          npm run build:electron
          npx vite build

      - name: Package Linux (AppImage & deb)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows (Portable & zip)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS (DMG & zip)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing in CI — users will need to right-click → Open on first launch
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml

      # ── Release uploads (only on tag pushes) ──────────────────────────────

      - name: Upload release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.AppImage,dist/*.deb,dist/latest-linux.yml"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.exe,dist/*.zip,dist/*.blockmap,dist/latest.yml"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.dmg,dist/*-mac.zip,dist/latest-mac.yml"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build (Melodix-Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Renderer
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Melodix-1.0.0-beta.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melodix-Android
          path: dist/Melodix-*.apk

      - name: Upload release assets (Android)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/Melodix-*.apk"
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

