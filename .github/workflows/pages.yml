name: Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'public/logo.png'
      - 'Screenshoot.jpg'
      - 'screenshot_*.jpg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site bundle
        run: |
          mkdir -p _site/assets
          cp -r docs/* _site/
          cp public/logo.png _site/assets/logo.png
          cp Screenshoot.jpg _site/assets/desktop.jpg
          cp screenshot_ios_glass.jpg _site/assets/ios.jpg
          cp screenshot_mobile.jpg _site/assets/android.jpg
          cp screenshot_mobile_player.jpg _site/assets/mobile-player.jpg
          cp screenshot_mobile_lyrics.jpg _site/assets/mobile-lyrics.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
